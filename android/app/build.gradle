plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.yhwh.app"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
                storeFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                storePassword = keystoreProperties['storePassword']
                v1SigningEnabled = true
                v2SigningEnabled = true
            } else {
                signingConfig = signingConfigs.debug
            }
        }
    }

    defaultConfig {
        applicationId = "com.yhwh.app"
        
        // 'flutter.minSdkVersion' en 21 (Android 5.0).
        // Esto garantiza compatibilidad con teléfonos desde el 2014/2015.
        minSdkVersion = flutter.minSdkVersion
        
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName

        // Soporte universal para procesadores de 32 bits (Tecno Pop / Spark Go) y 64 bits modernos
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            
            // Opcional: Ayuda a reducir el tamaño de la app
            // shrinkResources = true
            // minifyEnabled = true
        }
    }
}

flutter {
    source = "../.."
}
